<header class="header">
  {% if show_sidebar %}
    <button class="btn_menu">
      {% include "svg/menu.svg" %}
    </button>
  {% endif %}

  <p class="page_title"> {{ page_title | default: "" }} </p>

  <button type="submit" onclick="changeTheme()" class="btn_{% if dark_mode %}dark{% else %}light{% endif %}">
    {% if dark_mode %}
      {% include "svg/dark-mode.svg" %} 
    {% else %}
      {% include "svg/light-mode.svg" %}
    {% endif %}
  </button> 
</header>
