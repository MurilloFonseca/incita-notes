{% extends "layouts/default.html" %}

{% block content %}
<div class="login">
  <div class="login_container">
      <h2 class="login_msg">Bem-Vindo!</h2>
      <form action="/login" method="POST" class="login_form">
        <div class="login_field">
          <label for="email" class="login_lbl">email:</label>
          <input class="login_email" type="email" name="email">
        </div>
        <div class="login_field">
          <label for="password" class="login_lbl">senha:</label>
          <input class="login_pw" type="password" name="password">
        </div>
        <button class="login_btn" type="submit">Entrar</button>
      </form>
  </div>
</div>
{% endblock content %}
