<div class="group-page" 

     {% if group-id != "personal" %}
      hx-get="/group/{{group-id}}/page/{{page-id}}/blocks" 
     {% else %}
      hx-get="/page/{{page-id}}/blocks"
     {% endif %}

     hx-target=".page-main" 
     hx-swap="outerHTML" 
     :class="{'dark': darkmode}">
  <span class="title"> {{ page-title }} </span>
  <button class="options" :class="{'dark': darkmode}">
    {% include "svg/more-vert.svg" %}
  </button>
</div>
