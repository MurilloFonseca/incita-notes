{% extends "layouts/add-modal.html" %}

{% block form %}
  <form hx-post="" hx-target="" hx-swap="" class="form">
    {% include "components/input-field.html" :input-id "title" :input-label "Nome:" :input-auto "off" :input-type "text" %}
    <div class="bottom">
      <button type="button" class="cancel" :class="{'dark': darkmode}" @click="open = false">Cancel</button>
      <button type="submit" class="confirm" @click="open = false">Add</button>
    </div>
  </form>
{% endblock form %}
