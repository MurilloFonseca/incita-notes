<div class="input-field">
  <label for="{{input-id}}" class="label"> {{input-label}} </label>
    <input type="{% firstof input-type input-id %}" 
      id="{{ input-id }}" 
      class="input"
      name="{% firstof input-name input-id %}" 
      autocomplete="{% firstof input-auto input-id %}"
      :class="{'dark': darkmode}">
</div>
