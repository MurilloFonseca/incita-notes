{% extends "layouts/default.html" %}

{% block title %} Notes {% endblock title %}

{% block content %}

{% if page_id %} 
  <meta hx-get="/page/{{page_id}}" hx-trigger="load" hx-target=".page-main" hx-swap-oob="true" hx-swap="outerHTML">
{% endif %}

<div class="page" x-data="{sidebarOpen: $persist(true)}">
  {% include "components/header.html" :show_sidebar t %}
  <hr class="hr" :class="{'dark': darkmode}">
  {% include "page/main.html" %}
</div>

{% endblock content %}
